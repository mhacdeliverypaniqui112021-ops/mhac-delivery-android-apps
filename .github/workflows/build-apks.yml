name: Build MHAC Delivery APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          echo "Checking ZIP..."
          ls -lh mhac_fixed.zip
          unzip -t mhac_fixed.zip

      - name: Extract Android project
        run: |
          unzip -o mhac_fixed.zip
          rm -f mhac_fixed.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Build Admin APK
        run: |
          gradle :admin:assembleDebug --stacktrace

      - name: Build Customer APK
        run: |
          gradle :customer:assembleDebug --stacktrace

      - name: Build Rider APK
        run: |
          gradle :rider:assembleDebug --stacktrace

      - name: Verify APK files
        run: |
          ls -lh admin/build/outputs/apk/debug/admin-debug.apk
          ls -lh customer/build/outputs/apk/debug/customer-debug.apk
          ls -lh rider/build/outputs/apk/debug/rider-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: MHAC-ADMIN-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: MHAC-CUSTOMER-APK
          path: customer/build/outputs/apk/debug/customer-debug.apk

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: MHAC-RIDER-APK
          path: rider/build/outputs/apk/debug/rider-debug.apk
