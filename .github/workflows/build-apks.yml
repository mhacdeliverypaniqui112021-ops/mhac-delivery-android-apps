name: Build MHAC Delivery APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract patched MHAC project
        run: |
          rm -rf admin customer rider
          unzip -q "MHAC_FIXED_WEBVIEW_PATCH_V2.zip"
          echo "PROJECT CONTENTS:"
          find . -maxdepth 4 -type f | sort | head -150

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Build Admin Customer Rider APKs
        run: |
          ./gradle-8.7/bin/gradle \
            :admin:assembleDebug \
            :customer:assembleDebug \
            :rider:assembleDebug \
            --no-daemon

      - name: Check APKs
        run: |
          echo "=== ADMIN ==="
          find admin -type f -name "*.apk" -print

          echo "=== CUSTOMER ==="
          find customer -type f -name "*.apk" -print

          echo "=== RIDER ==="
          find rider -type f -name "*.apk" -print

          test -f admin/build/outputs/apk/debug/admin-debug.apk
          test -f customer/build/outputs/apk/debug/customer-debug.apk
          test -f rider/build/outputs/apk/debug/rider-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: MHAC-ADMIN-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: MHAC-CUSTOMER-APK
          path: customer/build/outputs/apk/debug/customer-debug.apk

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: MHAC-RIDER-APK
          path: rider/build/outputs/apk/debug/rider-debug.apk
