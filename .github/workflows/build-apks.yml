name: Build MHAC Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Admin project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q "MHAC_ADMIN_NEW_REPO_READY.zip" -d android-project
          echo "PROJECT CONTENTS:"
          find android-project -maxdepth 3 -type f | head -80

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Build Admin APK
        run: |
          cd android-project
          ../gradle-8.7/bin/gradle :app:assembleDebug --no-daemon

      - name: Check APK
        run: |
          find android-project -type f -name "*.apk" -print
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: MHAC-ADMIN-APK-NEW
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
